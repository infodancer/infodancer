name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Full-history gitleaks scan, shared with the repos on go-ci. False
  # positives go in .gitleaks.toml or .gitleaksignore at the repo root.
  secrets:
    uses: infodancer/workflows/.github/workflows/gitleaks.yml@v0
